spring.application.name=pastpapers-service

spring.mvc.problemdetails.enabled=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration (DML User - Runtime)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pastpapers_db}
spring.datasource.username=${DB_DML_USERNAME:pastpapers_dml_user}
spring.datasource.password=${DB_DML_PASSWORD:dml_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration (DDL User - Migrations)
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/pastpapers_db}
spring.flyway.user=${DB_DDL_USERNAME:pastpapers_ddl_user}
spring.flyway.password=${DB_DDL_PASSWORD:ddl_password}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true